name = "daily-poke-catch-bot"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Checks every hour and posts the Daily Catch in servers whose chosen hour (Eastern) has come.
[triggers]
crons = ["0 * * * *"]

[vars]
SITE_URL = "https://taziz05.github.io/daily-poke-catch"

# The database is created automatically on the first deploy.
[[d1_databases]]
binding = "DB"
database_name = "daily-poke-catch"

[observability]
enabled = true
